<app-rim>
  <div
    #headingElement
    head
    class="heading"
  >{{ headingFooting().header }}</div>

  <div class="slide-contents">
    @if (logoVisible() && logo(); as logo) {
      <img
        [src]="logo.src"
        class="venue-logo"
        [style]="logo.style ?? ''"
        [class.fade]="animateBusy()"
      />
    }
    <router-outlet/>
  </div>

  <div foot class="footing">{{ headingFooting().footer }}</div>
</app-rim>
