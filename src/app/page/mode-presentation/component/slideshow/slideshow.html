<app-rim>
  <div #headingElement head class="heading">{{ header() }}</div>

  <div
    class="slide-contents"
    [@routeAnimations]="currentRouteIndex()"
    (@routeAnimations.start)="animateBusy.set(true)"
    (@routeAnimations.done)="animateBusy.set(false)"
  >
    @if (logoVisible() && logo(); as logo) {
      <img
        [src]="logo.src"
        class="venue-logo"
        [style]="logo.style ?? ''"
        [class.fade]="animateBusy()"
      />
    }
    <router-outlet/>
  </div>

  <div foot class="footing">{{ footer() }}</div>
</app-rim>
