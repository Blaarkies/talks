<div class="s-p-layout">

  @for (pf of pitfalls; track pf.problem) {
    @if ($index === step()) {
      <app-problem
        [heading]="pf.problem"
        [description]="pf.description"
        [example]="pf.example"
        [solution]="pf.solution"
        animate.enter="enter"
        animate.leave="leave"
        class="problem"
      />
    }
  }

</div>
