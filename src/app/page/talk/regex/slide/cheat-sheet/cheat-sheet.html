<div class="s-c-s-layout">
  <div class="tables-layout">
    @let halfIndex = cheats.length / 2;
    <ng-container
      [ngTemplateOutlet]="tabled"
      [ngTemplateOutletContext]="{list: cheats.slice(0, halfIndex)}"
    />
    <ng-container
      [ngTemplateOutlet]="tabled"
      [ngTemplateOutletContext]="{list: cheats.slice(halfIndex)}"
    />
  </div>
</div>

<ng-template #tabled let-list="list">
  <div class="table">
    @for (row of list; track row?.[1] + $index) {
      <div class="row">
        <div class="symbol">{{ row?.[0] }}</div>
        <div class="description">{{ row?.[1] }}</div>
      </div>
    }
  </div>
</ng-template>
