<div class="input-container">
  <input
    type="checkbox"
    [id]="'control'+label()"
    [checked]="checked()"
    [disabled]="disabled()"
    #input
    (change)="onInputChange(input.checked)"
  />
  <!--TODO: add custom id for each instance-->
  <label [for]="'control'+label()">{{label()}}</label>
</div>
