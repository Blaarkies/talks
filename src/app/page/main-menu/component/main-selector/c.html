<app-selection-list
  #selector
  [header]="'MAIN MENU'"
  [options]="options()"
  (launch)="launchSelected($event.data.url)"
  (selectOption)="selectedOption.set($event)"
  (exitFocus)="selectorExit(selector, $event)"
>
  <ng-template let-option="option">
    <div class="columns">
      <a class="anti-a full-a" [routerLink]="option.data.url">
        {{ option.label }}
      </a>
      @if (option.data.venues) {
        <app-button
          type="2"
          [swap]="true"
          (click)="selectorExit(selector, option)"
        >
          {{ chars.arrowRight }}
        </app-button>
      }
    </div>
  </ng-template>
</app-selection-list>
