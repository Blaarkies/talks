<app-pane
  class="load-notes-pane"
  header="Load notes script"
  type="4"
>
  <div class="load-notes-layout">
    <div class="dos-row">
      <div class="from-storage">
        Last used script
        <app-tooltip
          class="tuck-right"
          [text]="scriptTutorial"
          type="2"
          swap="false"
        >
          <app-button type="4" [swap]="false">EXAMPLE</app-button>
        </app-tooltip>

        <app-button
          type="4"
          [swap]="true"
          (click1)="scriptSelect.emit(lastUsedScript())"
        >
          LOAD
        </app-button>
      </div>
      <pre class="last-used-script">{{ lastUsedScript() || 'None' }}</pre>
    </div>

    <div class="dos-row">
      <div>Copy&paste script</div>
      <textarea
        #copyPastArea
        (input)="scriptSelect.emit(copyPastArea.value)"
        maxlength="500000"
        rows="5"
      ></textarea>
    </div>

    <div class="dos-row">
      <div>Upload .txt file</div>
      <input
        class="drag-drop-here"
        type="file"
        accept="text/plain"
        (change)="loadFile($event.target)"
      />
    </div>

    <!--
    <div class="dos-row">
      <div>Record script</div>
      <app-button>
        <div class="fake-record-button">●</div>
      </app-button>
    </div>
    -->
  </div>
</app-pane>
